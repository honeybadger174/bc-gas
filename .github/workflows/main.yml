name: daily-rack-loop

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run daily loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          DIR="$(dirname "$(find . -name run.py -not -path './.git/*' | head -1)")"
          echo "Found project in: $DIR"
          cd "$DIR"
          pip install -r requirements.txt
          python run.py
          git config user.name  "rack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/
          git commit -m "daily: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: findsite
        run: echo "dir=$(dirname "$(find . -path '*/site/index.html' -not -path './.git/*' | head -1)")" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.findsite.outputs.dir }}
      - id: deployment
        uses: actions/deploy-pages@v4
